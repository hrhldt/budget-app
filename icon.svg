<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af52de" />
      <stop offset="100%" stop-color="#5856d6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Wings -->
  <g fill="#ffffff" fill-opacity="0.9" filter="url(#shadow)">
    <!-- Left Wing -->
    <path d="M 200 280 C 120 220, 60 260, 40 180 C 80 140, 160 160, 220 220 Z" />
    <path d="M 210 310 C 140 270, 80 320, 60 250 C 100 220, 170 230, 230 270 Z" fill-opacity="0.6" />
    
    <!-- Right Wing -->
    <path d="M 312 280 C 392 220, 452 260, 472 180 C 432 140, 352 160, 292 220 Z" />
    <path d="M 302 310 C 372 270, 432 320, 452 250 C 412 220, 342 230, 282 270 Z" fill-opacity="0.6" />
  </g>

  <!-- Glassmorphism Cash Bill -->
  <g filter="url(#shadow)" transform="rotate(-10 256 256)">
    <rect x="146" y="166" width="220" height="180" rx="24" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="3" stroke-opacity="0.5" />
    <rect x="161" y="181" width="190" height="150" rx="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />
    <circle cx="256" cy="256" r="45" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" />
    <text x="256" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>