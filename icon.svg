<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,.25)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Subtle shine overlay -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#shine)"/>

  <!-- Left wing -->
  <path d="M108 218 c-20-8-36-24-42-44 c-4-14-2-28 6-40 c10-14 28-20 44-16 c12 4 22 12 30 24 l16 26 c-18 10-36 26-48 44 z"
        fill="rgba(255,255,255,.55)" transform="rotate(-8, 150, 220)"/>
  <path d="M120 258 c-24-6-44-20-52-40 c-6-16-2-32 8-44 c12-14 30-18 48-12 c14 4 24 14 32 28 l12 22 c-16 12-32 28-42 46 z"
        fill="rgba(255,255,255,.35)" transform="rotate(-12, 140, 240)"/>

  <!-- Right wing -->
  <path d="M404 218 c20-8 36-24 42-44 c4-14 2-28-6-40 c-10-14-28-20-44-16 c-12 4-22 12-30 24 l-16 26 c18 10 36 26 48 44 z"
        fill="rgba(255,255,255,.55)" transform="rotate(8, 362, 220)"/>
  <path d="M392 258 c24-6 44-20 52-40 c6-16 2-32-8-44 c-12-14-30-18-48-12 c-14 4-24 14-32 28 l-12 22 c16 12 32 28 42 46 z"
        fill="rgba(255,255,255,.35)" transform="rotate(12, 372, 240)"/>

  <!-- Dollar sign -->
  <text x="256" y="340" text-anchor="middle"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-weight="700" font-size="280"
        fill="white" opacity=".95">$</text>

  <!-- Vertical line through dollar (top) -->
  <rect x="244" y="110" width="24" height="60" rx="12" fill="white" opacity=".95"/>

  <!-- Vertical line through dollar (bottom) -->
  <rect x="244" y="350" width="24" height="60" rx="12" fill="white" opacity=".95"/>
</svg>
